[project]
name = "cspawn"
version = "0.1.0"
description = "Spawn profiled Claude agents in isolated git worktrees via cmux"
requires-python = ">=3.11"
dependencies = ["click"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cspawn = "cspawn.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cspawn"]
