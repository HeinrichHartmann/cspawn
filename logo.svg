<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <!-- terminal box -->
  <rect x="4" y="4" width="72" height="44" rx="6" fill="#1a1a2e" stroke="#444" stroke-width="1.5"/>
  <!-- traffic lights -->
  <circle cx="14" cy="14" r="3" fill="#ff5f57"/>
  <circle cx="24" cy="14" r="3" fill="#febc2e"/>
  <circle cx="34" cy="14" r="3" fill="#28c840"/>
  <!-- prompt -->
  <text x="10" y="36" font-family="monospace" font-size="11" fill="#7c7cff">$</text>
  <text x="20" y="36" font-family="monospace" font-size="11" fill="#e0e0e0">cspawn</text>
  <!-- cursor blink -->
  <rect x="68" y="27" width="6" height="11" fill="#7c7cff" opacity="0.8"/>
  <!-- fork lines -->
  <line x1="76" y1="26" x2="90" y2="26" stroke="#7c7cff" stroke-width="1.5"/>
  <line x1="90" y1="26" x2="90" y2="18" stroke="#7c7cff" stroke-width="1.5"/>
  <line x1="90" y1="26" x2="90" y2="34" stroke="#7c7cff" stroke-width="1.5"/>
  <line x1="90" y1="18" x2="104" y2="18" stroke="#7c7cff" stroke-width="1.5"/>
  <line x1="90" y1="34" x2="104" y2="34" stroke="#7c7cff" stroke-width="1.5"/>
  <!-- agent nodes -->
  <rect x="104" y="12" width="12" height="12" rx="3" fill="#7c7cff"/>
  <rect x="104" y="28" width="12" height="12" rx="3" fill="#7c7cff"/>
  <!-- agent icons (lightning bolt stand-in: small 'λ') -->
  <text x="106" y="22" font-family="monospace" font-size="9" fill="#fff">λ</text>
  <text x="106" y="38" font-family="monospace" font-size="9" fill="#fff">λ</text>
</svg>
